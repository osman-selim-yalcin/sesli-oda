# Render servisi "Public Git Repository" ile bağlı olduğu için push'ları kendisi görmüyor.
# Her push'ta Render'ın Deploy Hook adresini çağırıp yeni sürümü yayına aldırır.
name: Render'a yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Hook'u çağır
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret'ı tanımlı değil, yayın atlandı."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render yayını başlatıldı."
