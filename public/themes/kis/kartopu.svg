  @keyframes fall { from { transform: translate(0, -20px); } 50% { transform: translate(8px, 180px); } to { transform: translate(0, 380px); } }
  
  @keyframes arm-l { 0% { transform: rotate(-15deg); } 0% { transform: rotate(-15deg); } 8% { transform: rotate(100deg); } 10% { transform: rotate(100deg); } 12% { transform: rotate(-120deg); } 16% { transform: rotate(-60deg); } 24% { transform: rotate(-15deg); } 100% { transform: rotate(-15deg); } }
