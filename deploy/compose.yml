# Sesli Oda: uygulama + Cloudflare tüneli.
# Depodaki bu dosya yalnız kaynaktır: sunucuda root'a ait onaylı kopyası /srv/sesli-oda/compose.yml kullanılır
# (yönetici gözden geçirip elle kopyalar; main'e push compose'u değiştiremez). Çağrı (deploy/yayin.sh böyle yapar;
# yayin.sh imajı build: bölümüyle değil, kendisi kurar):
#   docker compose -f /srv/sesli-oda/compose.yml --project-directory /srv/sesli-oda/app \
#     --env-file /srv/sesli-oda/.env ...
# Göreli yollar (build bağlamı) --project-directory'ye, yani depo kopyasına göre çözülür.
# env_file kullanılmaz: o dosyanın tamamını konteynere verirdi. Her konteyner yalnız kendi değişkenlerini alır:
# app TUNNEL_TOKEN'ı, tunnel Supabase anahtarını görmez. --env-file unutulursa zorunlu değişkenler (:?) yüzünden
# compose hiç çalışmaz (uygulama Supabase'siz, boş hafızayla açılmasın).
name: sesli-oda

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  init: true
  restart: unless-stopped
  networks: [sesli-oda]
  # Sunucunun üst DNS'i özel bir adreste (10.x); Docker'ın gömülü DNS'i onu konteynerin ad alanından sorar ve
  # güvenlik duvarı (deploy/sesli-oda-ag.sh) özel ağlara gideni düşürür. Herkese açık çözümleyiciler verilir;
  # app/tunnel adlarını gömülü DNS yine kendisi çözer.
  dns: [1.1.1.1, 9.9.9.9]
  logging:
    driver: journald
    options:
      tag: "sesli-oda-{{.Name}}"

services:
  app:
    <<: *hardening
    # deploy/yayin.sh imajı sesli-oda-app:<kısa sha> olarak kurar, APP_TAG=<kısa sha> ile başlatır ve sağlıklı
    # açılınca :current etiketini verir. Elle çalıştırmada APP_TAG yok: son sağlıklı sürüm (current).
    image: sesli-oda-app:${APP_TAG:-current}
    pull_policy: never
    build:
      context: .
      dockerfile: deploy/Dockerfile
    # Dockerfile'daki USER ve HEALTHCHECK'e güvenilmez (push ile değişebilir): burada sabit.
    user: "1000:1000" # node:22-alpine'daki node kullanıcısı
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/theme-list').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3
    tmpfs: [/tmp]
    mem_limit: 512m
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?/srv/sesli-oda/.env içinde SUPABASE_URL yok (--env-file verildi mi?)}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?/srv/sesli-oda/.env içinde SUPABASE_SECRET_KEY yok}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:?/srv/sesli-oda/.env içinde CLIENT_IP_HEADER yok (cf-connecting-ip)}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
      YT_API_KEY: ${YT_API_KEY:-}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    # ports: yok. Uygulamaya yalnız tunnel konteyneri bu ağ üzerinden (app:3030) ulaşır.

  tunnel:
    <<: *hardening
    image: cloudflare/cloudflared:2026.11.1
    command: tunnel --no-autoupdate run
    mem_limit: 256m
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?/srv/sesli-oda/.env içinde TUNNEL_TOKEN yok}
    depends_on:
      app:
        condition: service_healthy

# IPv6 açılmadı (enable_ipv6 yok): sunucu güvenlik duvarı kuralları (deploy/sesli-oda-ag.sh) yalnız IPv4'tür.
networks:
  sesli-oda:
    name: sesli-oda
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/28
